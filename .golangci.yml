version: "2"
run:
  timeout: 10m
  tests: false
  modules-download-mode: readonly
  go: "1.26"
linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - contextcheck
    - cyclop
    - decorder
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - errcheck
    - errname
    - errorlint
    - forbidigo
    - forcetypeassert
    - funlen
    - gocritic
    - godot
    - godox
    - gomoddirectives
    - gosec
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - nilerr
    - nilnil
    - noctx
    - prealloc
    - predeclared
    - reassign
    - revive
    - staticcheck
    - tagliatelle
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - wastedassign
  settings:
    gocritic:
      enabled-tags: [diagnostic, style, performance, experimental, opinionated]
      disabled-checks: [hugeParam, rangeExprCopy, rangeValCopy]
    errcheck:
      check-type-assertions: true
      check-blank: true
    govet:
      enable-all: true
      disable: [fieldalignment]
    nakedret:
      max-func-lines: 1
    tagliatelle:
      case:
        rules:
          json: snake
          toml: snake
    dupl:
      threshold: 75
    lll:
      line-length: 120
      tab-width: 4
    misspell:
      locale: US
    forbidigo:
      forbid:
        - pattern: ^fmt\.Print.*$
          msg: use the configured logger, not fmt printing (skill ness-interface-design, section Wiring)
        - pattern: ^log\.Print.*$
          msg: use the configured logger, not the log package (skill ness-interface-design, section Wiring)
formatters:
  enable: [gofmt, goimports, gofumpt]
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes: [github.com/enea-scaccabarozzi/ness]
