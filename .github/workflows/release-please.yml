# release-please keeps a release pull request open from the commits on main; merging it tags the
# release. The tag release-please creates with GITHUB_TOKEN triggers no workflow, so the build
# runs here, after the Running sessions notes test.
name: release-please
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Require a sessions commit
        # Only the merge of a release pull request cuts a release; every other push only updates it.
        if: "${{ startsWith(github.event.head_commit.message, 'chore(main): release') }}"
        run: |
          last=$(git describe --tags --abbrev=0 2>/dev/null || git rev-list --max-parents=0 HEAD)
          # %B: a squash lists the folded subjects as nested commits in its body (D44).
          git log --format=%B "$last..HEAD" | grep -Eq '^sessions(\(|!|:)' || {
            echo "no sessions: commit since $last; add one (e.g. 'sessions: nothing to do') before releasing"
            exit 1
          }
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - if: steps.rp.outputs.release_created
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.rp.outputs.tag_name }}
          fetch-depth: 0
      - if: steps.rp.outputs.release_created
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
      - if: steps.rp.outputs.release_created
        run: go test ./internal/sync/
      - if: steps.rp.outputs.release_created
        run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
