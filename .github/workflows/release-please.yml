# release-please keeps a release pull request open from the commits on main; merging it tags the
# release. The tag release-please creates with GITHUB_TOKEN triggers no workflow, so the build
# of stable tags runs here, after the Running sessions notes test; rc tags build in rc.yml.
name: release-please
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Require an rc of this tree, the upgrade fixture and a sessions commit
        # release-please releases every merged pull request still labelled autorelease: pending,
        # whatever the merge method and on any later push or dispatch, so each one is checked at
        # its merge commit before release-please runs.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shas=$(gh pr list --state merged --label 'autorelease: pending' --json mergeCommit --jq '.[].mergeCommit.oid')
          for sha in $shas; do
            git checkout -q --detach "$sha"
            sh .github/scripts/release-check.sh stable "$(jq -r '."."' .release-please-manifest.json)"
          done
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - if: steps.rp.outputs.release_created
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.rp.outputs.tag_name }}
          fetch-depth: 0
      - if: steps.rp.outputs.release_created
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
      - if: steps.rp.outputs.release_created
        run: go test ./internal/sync/
      - if: steps.rp.outputs.release_created
        run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
